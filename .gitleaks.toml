title = "AyoHadir secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Supabase publishable key is intentionally bundled in the mobile client"
  condition = "AND"
  regexTarget = "line"
  paths = ['''^app\.json$''']
  regexes = [
    '''"supabasePublishableKey"\s*:\s*"sb_publishable_[A-Za-z0-9_-]+"'''
  ]

  [[rules.allowlists]]
  description = "Historical Supabase publishable key in client config is public by design, retained only in Git history"
  paths = ['''^src/lib/supabase\.ts
'']
  regexes = ['''sb_publishable_[A-Za-z0-9_-]+''']
