<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center">
<!-- 
      Contextual Header for Detail View. 
      Global Navigation Shell (TopAppBar/BottomNavBar) is suppressed as this is a focused detail/task journey.
    -->
<header class="w-full max-w-2xl px-margin-mobile md:px-margin-desktop py-sm flex items-center justify-between border-b border-primary/10 bg-surface z-10 sticky top-0">
<button class="text-primary p-2 -ml-2 rounded-full hover:bg-surface-container-low transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary absolute left-1/2 -translate-x-1/2">
            Detail Sesi
        </h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-2xl px-margin-mobile md:px-margin-desktop py-lg flex flex-col gap-lg">
<!-- Status & QR Code Section -->
<section class="flex flex-col items-center gap-md">
<!-- Status Badge -->
<div class="bg-error-container text-on-error-container font-label-md text-label-md px-4 py-2 rounded-full flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]">timer_off</span>
<span>Kedaluwarsa</span>
</div>
<!-- QR Code Card (Disabled State) -->
<div class="w-full max-w-xs aspect-square bg-surface-container-low border border-outline-variant rounded-xl p-md flex flex-col items-center justify-center relative overflow-hidden group">
<!-- Blurred/Grayscale QR Image -->
<div class="relative w-full h-full flex items-center justify-center opacity-40 grayscale blur-[2px]">
<img class="object-contain w-full h-full" data-alt="A high-contrast, minimalist QR code graphic rendered in sharp black and white, suitable for a professional mobile application. The code is crisp and geometric, set against a pristine, light mode background devoid of clutter. The aesthetic aligns with an organic, refined professional design system, emphasizing clarity and modern utility." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDETCZmCZabURGMHhD3WvasTs71QBc359MIz_CEQi3MTS2fx1oXjJksqGLXa0G_3QCp4lrLeCzMalBSbA0QveRkXLc0bdiwFzb4_86Tp4mtAV9cvdQkDFqaVrVLx1RifRKgc1nT6ENKdPCJSqXRB9OuYXeWGYIco4m3nD2wHrbH078rLEl26oJ1oups1Bk6QWa9gJTqskcOVCBM3UHPMW4Iw3PfvI4AT_mmD37hvtxlGIJnMnr02z21"/>
</div>
<!-- Overlay Lock Icon -->
<div class="absolute inset-0 flex flex-col items-center justify-center bg-surface/30 backdrop-blur-sm">
<div class="bg-surface p-4 rounded-full shadow-sm border border-outline/10 text-on-surface-variant flex items-center justify-center mb-xs">
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
</div>
</div>
<!-- Message -->
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-sm">
                Sesi ini telah berakhir pada 24 Okt, 10:00 WIB
            </p>
</section>
<!-- Primary & Destructive Actions -->
<section class="flex flex-col gap-sm mt-xs w-full max-w-sm mx-auto">
<!-- View History -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-lg flex items-center justify-center gap-xs hover:bg-on-primary-fixed-variant transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-[20px]">history</span>
<span>Lihat Riwayat</span>
</button>
<!-- Delete Session -->
<button class="w-full bg-transparent border border-error text-error font-label-md text-label-md py-4 rounded-lg flex items-center justify-center gap-xs hover:bg-error-container/50 transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-[20px]">delete</span>
<span>Hapus Sesi</span>
</button>
</section>
<!-- Divider -->
<div class="w-full max-w-sm mx-auto h-px bg-outline-variant/30 my-xs"></div>

<section class="w-full max-w-sm mx-auto flex justify-around items-start opacity-40 pointer-events-none">
<!-- Edit (Disabled) -->
<div class="flex flex-col items-center gap-xs">
<div class="w-12 h-12 rounded-full border border-outline-variant flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">edit</span>
</div>
<span class="font-caption text-caption text-on-surface-variant">Edit</span>
</div>

<span class="material-symbols-outlined">share</span>
</div>

</div>
<!-- Download (Disabled) -->
<div class="flex flex-col items-center gap-xs">
<div class="w-12 h-12 rounded-full border border-outline-variant flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">download</span>
</div>
<span class="font-caption text-caption text-on-surface-variant">Download</span>
</div>
</section>
