<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="min-h-screen flex flex-col items-center justify-center bg-background px-margin-mobile md:px-margin-desktop py-xl">
<!-- Main Container -->
<main class="w-full max-w-lg mx-auto flex flex-col items-center text-center bg-surface-container-lowest border border-outline-variant/30 rounded-xl p-lg pt-xl">
<!-- Success Icon -->
<div class="mb-md flex items-center justify-center w-24 h-24 rounded-full bg-secondary-container/20 text-primary">
<span class="material-symbols-outlined" data-icon="check_circle" style="font-size: 64px; font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<!-- Heading -->
<h1 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg text-primary mb-sm">
            QR Berhasil Dibuat!
        </h1>
<!-- Subheading -->
<p class="text-body-md font-body-md text-on-surface-variant mb-xl">
            Sesi absensi siap digunakan. Peserta dapat mulai memindai kode ini.
        </p>
<!-- QR Display Container -->
<div class="w-full max-w-sm bg-surface-container-low rounded-lg p-md mb-lg border border-outline-variant/50 relative overflow-hidden flex flex-col items-center justify-center">
<!-- Placeholder for dynamic QR code image -->
<img alt="Dynamic QR Code" class="w-48 h-48 mb-md object-contain border border-outline-variant/30 p-2 bg-white rounded-md" data-alt="A clean, crisp QR code presented in a minimalist, high-end professional UI context. The QR code itself is dark olive green on a stark white background. Soft studio lighting highlights the matte texture of the surrounding interface. Mossy Valley aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDn08ibCfrJpfMTsYnJG_GEAP-TBLwoJazhEW9uKLtft3VxeRaA8vtNp9Gre1h73uI9vJmiKYQY9TL5UirLyluteGbN1hu2l5WZCSVUtVNcqDxHck7ZntaNNenlFXjg-diP_UmsSrIsguHMSBJzEgpPeprnM_hOH39SoWLiYYAsBDg1FCNA5ZHdKiFUJsLQGCIxdRDPJUOMbAmVNtR4LV7jVYTjkvEdxiqI47RwaJV6cMWXOfj5mbtK"/>
<div class="flex items-center gap-xs text-caption font-caption text-secondary">
<span class="material-symbols-outlined text-sm" data-icon="timer">timer</span>
<span>Token diperbarui setiap 10 menit</span>
</div>
</div>
<!-- Actions -->
<div class="w-full flex flex-col gap-sm mt-md">
<button class="w-full flex items-center justify-center gap-2 bg-primary text-on-primary font-label-md text-label-md py-3 px-6 rounded-lg hover:bg-primary/90 transition-colors">
<span class="material-symbols-outlined" data-icon="share">share</span>
                Share QR
            </button>
<button class="w-full flex items-center justify-center gap-2 border border-outline text-primary font-label-md text-label-md py-3 px-6 rounded-lg hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined" data-icon="download">download</span>
                Download as Image
            </button>
<button class="w-full flex items-center justify-center gap-2 text-on-surface-variant font-label-md text-label-md py-3 px-6 rounded-lg hover:bg-surface-container transition-colors mt-xs">
<span class="material-symbols-outlined" data-icon="history">history</span>
                View Session History
            </button>
</div>
