<style>
        /* Custom range slider styling */
        input[type=range] {
            -webkit-appearance: none;

<body class="bg-background text-on-surface min-h-screen pb-32">
<!-- TopAppBar (Transactional - Hidden on Web, using back button style) -->
<header class="fixed top-0 w-full z-50 bg-background border-b border-primary/10 flex items-center justify-between px-margin-mobile h-16 md:px-margin-desktop">
<div class="flex items-center gap-4">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant active:scale-95 duration-150">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">Buat Sesi Absensi</h1>
</div>
<button class="p-2 -mr-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant active:scale-95 duration-150">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 px-margin-mobile md:px-margin-desktop max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-gutter">
<!-- Left Column: Primary Settings -->
<div class="md:col-span-7 flex flex-col gap-lg">
<!-- Session Title -->
<section class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="session-title">Session Title</label>
<input class="w-full bg-transparent border border-outline-variant rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-surface focus:border-primary focus:border-2 focus:outline-none transition-all placeholder:text-outline" id="session-title" placeholder="e.g. Weekly All Hands" type="text"/>
</section>
<!-- Target Participants Toggle -->
<section class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface">Target Participants</label>
<div class="flex p-1 bg-surface-container-low border border-outline-variant/30 rounded-lg">
<button class="flex-1 py-2 px-4 rounded-DEFAULT bg-primary text-on-primary font-label-md text-label-md transition-colors text-center">
                        All Employees
                    </button>
<button class="flex-1 py-2 px-4 rounded-DEFAULT text-on-surface-variant hover:bg-surface-variant/50 font-label-md text-label-md transition-colors text-center">
                        Specific Group
                    </button>
</div>
</section>
<!-- Duration Slider -->
<section class="flex flex-col gap-sm p-md border border-outline-variant/30 rounded-xl bg-surface-container-lowest">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface">Session Duration</label>
<span class="font-body-md text-body-md text-primary font-semibold" id="duration-val">8 Hours</span>
</div>
<div class="pt-2">
<input class="w-full" id="duration-slider" max="24" min="1" type="range" value="8"/>
</div>
<div class="flex justify-between font-caption text-caption text-outline">
<span>1h</span>
<span>12h</span>
<span>24h</span>
</div>
</section>
<!-- Late Threshold -->
<section class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="late-time">Late Threshold</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">schedule</span>
<input class="w-full bg-transparent border border-outline-variant rounded-DEFAULT pl-12 pr-4 py-3 font-body-md text-body-md text-on-surface focus:border-primary focus:border-2 focus:outline-none transition-all" id="late-time" type="time" value="09:15"/>
</div>
<p class="font-caption text-caption text-outline mt-1">Attendees scanning after this time will be marked as late.</p>
</section>
</div>
<!-- Right Column: Geofencing & Action -->
<div class="md:col-span-5 flex flex-col gap-lg">
<!-- Geofencing Card -->
<section class="flex flex-col gap-md p-md border border-outline-variant/30 rounded-xl bg-surface-container-lowest">
<div class="flex justify-between items-center">
<div class="flex flex-col">
<h3 class="font-label-md text-label-md text-on-surface">GPS &amp; Geofencing</h3>
<p class="font-caption text-caption text-outline">Restrict attendance to a specific location</p>
</div>
<!-- Toggle Switch -->
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<!-- Radius Slider -->
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-center">
<label class="font-caption text-caption text-on-surface-variant">Allowed Radius</label>
<span class="font-caption text-caption text-primary font-semibold">150m</span>
</div>
<input class="w-full" max="3000" min="5" type="range" value="150"/>
</div>

<div class="absolute inset-0 bg-primary/5 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-3xl drop-shadow-md" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
</div>
<p class="font-caption text-caption text-outline flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">info</span>
                    Using current office location (HQ).
                </p>
</section>
</div>
</main>

<div class="fixed bottom-0 w-full z-50 bg-surface/95 backdrop-blur-sm border-t border-primary/10 px-margin-mobile py-4 md:px-margin-desktop flex justify-end items-center gap-4">
<button class="px-6 py-3 rounded-DEFAULT border border-secondary text-secondary font-label-md text-label-md hover:bg-surface-variant transition-colors">
            Cancel
        </button>
<button class="px-8 py-3 rounded-DEFAULT bg-primary text-on-primary font-label-md text-label-md hover:bg-on-primary-fixed-variant transition-colors flex items-center gap-2 shadow-sm">
<span class="material-symbols-outlined text-[20px]">qr_code</span>
            Generate QR
        </button>

<script>
        // Simple slider interaction
        const durationSlider = document.getElementById('duration-slider');
        const durationVal = document.getElementById('duration-val');
        
        if(durationSlider && durationVal) {
            durationSlider.addEventListener('input', (e) => {
                durationVal.textContent = `${e.target.value} Hours`;
            });
        }
    </script>
