<!DOCTYPE html>

<html lang="id"><head>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom Input Styling for Mossy Valley Aesthetic */
        .moss-input:focus {
            border-color: #3e5219; /* primary */
            box-shadow: none;
            border-width: 2px;
            outline: none;
        }
        .moss-input {
            border-color: #c5c8b8; /* outline-variant */
            border-width: 1px;
            transition: all 0.2s ease-in-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden">
<!-- Subtle Background Elements -->
<div class="absolute top-0 left-0 w-full h-full pointer-events-none z-0 overflow-hidden opacity-50">
<div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-secondary-container rounded-full blur-[100px] opacity-40"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-80 h-80 bg-primary-container rounded-full blur-[100px] opacity-20"></div>
</div>
<!-- Login Container -->
<main class="w-full max-w-[420px] bg-surface z-10 rounded-2xl relative">
<!-- Subtle border instead of shadow -->
<div class="absolute inset-0 border border-outline-variant/30 rounded-2xl pointer-events-none"></div>
<div class="p-lg md:p-xl flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-lg flex flex-col items-center">
<div class="w-16 h-16 bg-primary-container/20 rounded-xl flex items-center justify-center mb-xs">
<span class="material-symbols-outlined filled text-primary" style="font-size: 32px;">cloud_sync</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary tracking-tight">Ayo Hadir</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs text-center">Masuk untuk mengelola kehadiran dan data tim Anda.</p>
</div>
<!-- Login Form -->
<form class="w-full flex flex-col gap-md">
<!-- Email Field -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 transform -translate-y-1/2 text-outline">mail</span>
<input class="moss-input w-full bg-surface-bright rounded-lg py-3 pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder:text-outline-variant transition-colors" id="email" placeholder="nama@perusahaan.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-base">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Kata Sandi</label>
<a class="font-caption text-caption text-secondary hover:text-primary transition-colors" href="#">Lupa Kata Sandi?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 transform -translate-y-1/2 text-outline">lock</span>
<input class="moss-input w-full bg-surface-bright rounded-lg py-3 pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder:text-outline-variant transition-colors" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full mt-sm bg-primary text-on-primary font-label-md text-label-md py-4 rounded-lg hover:bg-surface-tint transition-colors active:scale-[0.98] flex justify-center items-center gap-xs" type="submit">
                    Masuk
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Registration Link -->
<div class="mt-lg w-full border-t border-surface-variant pt-md text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Belum punya akun? <a class="text-primary font-medium hover:underline decoration-primary/50 underline-offset-4 transition-all" href="#">Daftar sekarang</a>
</p>
</div>
</div>
</main>
</body></html>
