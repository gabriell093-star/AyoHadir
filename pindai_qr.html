<style>
        /* Camera overlay styles */

            background-color: rgba(0, 0, 0, 0.6);
        }
        
        /* Focus bracket styles */
        .focus-bracket {
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: #86f2e4; /* secondary-container / Teal */
            border-style: solid;
        }
        .bracket-tl { top: 0; left: 0; border-width: 4px 0 0 4px; border-top-left-radius: 8px; }
        .bracket-tr { top: 0; right: 0; border-width: 4px 4px 0 0; border-top-right-radius: 8px; }
        .bracket-bl { bottom: 0; left: 0; border-width: 0 0 4px 4px; border-bottom-left-radius: 8px; }
        .bracket-br { bottom: 0; right: 0; border-width: 0 4px 4px 0; border-bottom-right-radius: 8px; }
