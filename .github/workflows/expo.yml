name: Expo Source Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: expo-source-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Secret and debug guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn --exclude-dir=.git --exclude='package-lock.json' --exclude='*.md' -E '(BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|SUPABASE_SERVICE_ROLE_KEY|service_role|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,})' . 
          ! grep -RIn --exclude-dir=.git -E 'dangerouslySetInnerHTML|<WebView|eval\(|new Function\(' app src
          ! grep -RIn --exclude-dir=.git -E 'console\.(log|debug|info)\(' app src supabase/functions || true --no-audit --no-fund

      - name: Expo doctor
        run: npx expo-doctor

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Guard dummy UI interactions
        run: |
          ! grep -R -n -E 'onPress=\{\(\) => \{\}\}|onPress=\{\(\) => null\}|onPress=\{\(\) => undefined\}' app src

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Type check Edge Functions
        run: deno check --all --config supabase/deno.json supabase/functions/*/index.ts

      - name: Guard legacy green tokens
        run: |
          ! grep -R -n -E 'emerald-[0-9]+|#10B981|#059669' app src
