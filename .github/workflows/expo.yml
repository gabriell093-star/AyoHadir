name: Expo Source Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Build a release APK after validation"
        required: true
        default: false
        type: boolean
      signing_mode:
        description: "Signing mode for the APK"
        required: true
        default: "temporary_test"
        type: choice
        options:
          - temporary_test
          - stable_public

permissions:
  contents: read


concurrency:
  group: expo-source-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.invalid
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate build environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "Missing GitHub Actions secret SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "Missing GitHub Actions secret SUPABASE_PUBLISHABLE_KEY"; exit 1; }

      - name: Gitleaks history scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Secret and debug guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn -E '(BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SECRET_KEY|service_role|sb_secret_|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,})' app src supabase; then
            echo "Potential secret detected in repository."
            exit 1
          fi
          if grep -RIn -E 'dangerouslySetInnerHTML|<WebView|eval\(|new Function\(' app src; then
            echo "Unsafe web/eval primitive detected."
            exit 1
          fi
          if grep -RIn -E 'console\.(log|debug|info|warn|error)\(|debugger[;[:space:]]' app src supabase/functions; then
            echo "Debug logging or debugger statement detected."
            exit 1
          fi

      - name: Expo doctor
        run: npx expo-doctor

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Guard dummy UI interactions
        run: |
          ! grep -R -n -E 'onPress=\{\(\) => \{\}\}|onPress=\{\(\) => null\}|onPress=\{\(\) => undefined\}' app src

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Type check Edge Functions
        run: deno check --all --config supabase/deno.json supabase/functions/*/index.ts

      - name: Guard legacy green tokens
        run: |
          ! grep -R -n -E 'emerald-[0-9]+|#10B981|#059669' app src

  build-android:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_apk == true) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
    needs: validate-source
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate build environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "Missing GitHub Actions secret SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "Missing GitHub Actions secret SUPABASE_PUBLISHABLE_KEY"; exit 1; }

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare stable public signing key
        if: ${{ inputs.signing_mode == 'stable_public' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64:-}" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "${ANDROID_KEYSTORE_PASSWORD:-}" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "${ANDROID_KEY_ALIAS:-}" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "${ANDROID_KEY_PASSWORD:-}" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
          KEYSTORE="$RUNNER_TEMP/ayohadir-release.keystore"
          printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          {
            echo "AYOHADIR_KEYSTORE=$KEYSTORE"
            echo "AYOHADIR_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "AYOHADIR_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "AYOHADIR_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Generate temporary release signing key
        if: ${{ inputs.signing_mode != 'stable_public' }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/ayohadir-release.keystore"
          PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -v             -keystore "$KEYSTORE"             -storepass "$PASSWORD"             -keypass "$PASSWORD"             -alias ayohadir             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=AyoHadir, OU=Mobile, O=AyoHadir, C=ID"
          {
            echo "AYOHADIR_KEYSTORE=$KEYSTORE"
            echo "AYOHADIR_KEYSTORE_PASSWORD=$PASSWORD"
            echo "AYOHADIR_KEY_ALIAS=ayohadir"
            echo "AYOHADIR_KEY_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Configure release signing
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          cat >> app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("AYOHADIR_KEYSTORE"))
                      storePassword System.getenv("AYOHADIR_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("AYOHADIR_KEY_ALIAS")
                      keyPassword System.getenv("AYOHADIR_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify release APK signature and debug state
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          if grep -q "application-debuggable" "$RUNNER_TEMP/badging.txt"; then
            echo "Release APK is debuggable."
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: AyoHadir-Android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
