name: Android APK Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-apk-release-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPO_TOKEN: \${{ secrets.EXPO_TOKEN }}
      SUPABASE_URL: \${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: \${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      EAS_LOCAL_BUILD_SKIP_CLEANUP: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Verify Android toolchain
        run: |
          set -euo pipefail
          java -version
          adb version
          test -d "$ANDROID_NDK_HOME"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check required secrets
        run: |
          set -euo pipefail
          test -n "\${EXPO_TOKEN:-}" || { echo "Missing EXPO_TOKEN."; exit 1; }
          test -n "\${SUPABASE_URL:-}" || { echo "Missing SUPABASE_URL."; exit 1; }
          test -n "\${SUPABASE_PUBLISHABLE_KEY:-}" || { echo "Missing SUPABASE_PUBLISHABLE_KEY."; exit 1; }

      - name: Install JavaScript dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Create and verify package lockfile
        run: |
          set -euo pipefail
          npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Validate Expo configuration
        run: npx expo config --type public --json > "$RUNNER_TEMP/expo-config.json"

      - name: Build signed production APK locally with EAS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx eas-cli@latest build \
            --platform android \
            --profile production-apk \
            --local \
            --non-interactive \
            --output artifacts/AyoHadir-Android-release.apk
          test -s artifacts/AyoHadir-Android-release.apk
          file artifacts/AyoHadir-Android-release.apk
          sha256sum artifacts/AyoHadir-Android-release.apk | tee artifacts/AyoHadir-Android-release.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyoHadir-Android-release
          path: |
            artifacts/AyoHadir-Android-release.apk
            artifacts/AyoHadir-Android-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
