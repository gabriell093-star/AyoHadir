name: EAS Android Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: eas-android-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android with Expo EAS
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check Expo token
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || {
            echo "Missing GitHub Actions secret EXPO_TOKEN."
            exit 1
          }

      - name: Check Supabase build variables
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "Missing SUPABASE_URL"; exit 1; }
          test -n "${SUPABASE_PUBLISHABLE_KEY:-}" || { echo "Missing SUPABASE_PUBLISHABLE_KEY"; exit 1; }

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Create deterministic npm lockfile for EAS archive
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Verify npm lockfile
        run: |
          set -euo pipefail
          test -s package-lock.json
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          echo "package-lock.json verified."

      - name: Validate EAS project configuration
        run: npx expo config --type public --json > "$RUNNER_TEMP/expo-config.json"

      - name: Sync Supabase variables to EAS production environment
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli@latest env:set --name SUPABASE_URL --value "$SUPABASE_URL" --environment production --visibility sensitive --non-interactive
          npx eas-cli@latest env:set --name SUPABASE_PUBLISHABLE_KEY --value "$SUPABASE_PUBLISHABLE_KEY" --environment production --visibility sensitive --non-interactive

      - name: Build production APK with EAS
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli@latest build \
            --platform android \
            --profile production-apk \
            --non-interactive \
            --wait \
            --clear-cache \
            --json > "$RUNNER_TEMP/eas-build.json"

          BUILD_ID="$(node -e '
            const fs=require("fs");
            const raw=fs.readFileSync(process.argv[1],"utf8").trim();
            const x=JSON.parse(raw);
            const row=Array.isArray(x) ? x[0] : (x.build ?? x.data?.build ?? x.data?.[0] ?? x);
            if (!row?.id) process.exit(2);
            process.stdout.write(row.id);
          ' "$RUNNER_TEMP/eas-build.json")"

          test -n "$BUILD_ID"
          echo "EAS_BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "EAS build completed: $BUILD_ID"

      - name: Verify completed EAS build artifact
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli@latest build:view "$EAS_BUILD_ID" --json > "$RUNNER_TEMP/eas-build-view.json"
          node -e '
            const fs=require("fs");
            const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            const row=x.build ?? x.data?.build ?? x;
            if (!row?.id) process.exit(2);
            if (row.status !== "FINISHED" && row.status !== "finished") process.exit(3);
            if (!row.artifacts?.buildUrl) process.exit(4);
            console.log("EAS status:", row.status);
            console.log("APK artifact is available.");
          ' "$RUNNER_TEMP/eas-build-view.json"

      - name: Download APK from EAS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx eas-cli@latest build:download --build-id "$EAS_BUILD_ID" --non-interactive --output artifacts/AyoHadir-Android-release.apk
          test -s artifacts/AyoHadir-Android-release.apk
          file artifacts/AyoHadir-Android-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyoHadir-Android-release-EAS
          path: artifacts/AyoHadir-Android-release.apk
          if-no-files-found: error
          retention-days: 14
