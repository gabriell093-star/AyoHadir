<div class="w-full max-w-md bg-surface-container-lowest rounded-xl border border-outline-variant p-lg md:p-xl flex flex-col gap-lg">

<span class="material-symbols-outlined text-xl">arrow_back</span>

            </a>
<!-- Text Content -->
<div class="flex flex-col gap-xs">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background">
                    Lupa Kata Sandi
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Jangan khawatir. Masukkan alamat email yang terhubung dengan akun Anda, dan kami akan mengirimkan instruksi untuk mengatur ulang kata sandi.
                </p>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-md w-full mt-sm" method="POST">
<div class="flex flex-col gap-xs w-full">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all shadow-sm" id="email" name="email" placeholder="nama@perusahaan.com" required="" type="email"/>
</div>
</div>
<button class="w-full py-3 mt-sm bg-primary hover:bg-surface-tint text-on-primary font-label-md text-label-md rounded-lg flex items-center justify-center gap-2 transition-colors focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface" type="submit">
                    Kirim Instruksi
                    <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'wght' 600;">send</span>
</button>
</form>
<div class="mt-xs text-center">
<p class="font-caption text-caption text-outline">
                    Butuh bantuan lebih lanjut? <a class="text-primary hover:underline font-medium" href="#">Hubungi Dukungan IT</a>
